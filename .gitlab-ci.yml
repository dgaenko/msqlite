image: golang:1.22-bookworm

stages:
  - check
  - build

variables:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  GOFLAGS: "-trimpath"

check:
  stage: check
  script:
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

build:
  stage: build
  script:
    - make build-amd64 build-arm64 build-armv7
  artifacts:
    paths:
      - bin/
    expire_in: 1 week
